<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search — Cat Food Center</title>
  <link rel="icon" href="./favicon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#C2410C">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <!-- Blocking on purpose: applies the stored theme before first paint. -->
  <script src="./assets/cfc-theme.js"></script>
  <link rel="stylesheet" href="./assets/cfc-tokens.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./assets/cfc-tailwind.js"></script>
  <style>
    body { background: var(--bg); font-family: 'Public Sans', system-ui, sans-serif; }
    .font-display { font-family: 'Fraunces', Georgia, serif; }
    .text-h1      { font-size: 1.75rem; line-height: 1.2; }
    .text-h2      { font-size: 1.25rem; line-height: 1.3; }
    .text-small   { font-size: .875rem; line-height: 1.5; }
    .text-micro   { font-size: .75rem;  line-height: 1.4; }
    .rounded-card { border-radius: 12px; }
    .rounded-pill { border-radius: 999px; }
    .max-w-content { max-width: 720px; }
    .card-link { display: flex; text-decoration: none; transition: border-color 150ms; }
    .card-link:hover { border-color: var(--accent) !important; }
    .wordmark:hover { color: var(--accent); }
    .btn-link { text-decoration: none; transition: opacity 150ms; }
    .btn-link:hover { opacity: .9; }
    .footer-link { text-decoration: none; }
    .footer-link:hover { text-decoration: underline; }
    input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: 0; box-shadow: none; }
    /* Header nav */
    .nav-link { font-size: .875rem; color: var(--ink-soft); text-decoration: none; padding: 4px 8px; border-radius: 6px; transition: color 150ms; white-space: nowrap; }
    .nav-link:hover:not([aria-current]) { color: var(--ink); }
    .nav-link[aria-current="page"] { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body class="bg-bg text-ink min-h-screen flex flex-col">

  <!-- ── Header ── -->
  <header class="sticky top-0 z-50 bg-surface border-b border-hairline">
    <div class="max-w-content mx-auto px-4 h-14 flex items-center justify-between gap-2">
      <a href="./index.html" class="wordmark font-display text-h2 text-ink font-semibold tracking-tight shrink-0" style="text-decoration:none;transition:color 150ms;">
        Cat Food Center
      </a>
      <nav class="flex items-center gap-1 min-w-0" aria-label="Main navigation" style="overflow-x:auto;scrollbar-width:none">
        <a href="./index.html" class="nav-link">Home</a>
        <a href="./scan.html" class="nav-link">Scan</a>
        <a href="./search.html" class="nav-link" aria-current="page">Search</a>
        <a href="./learn.html" class="nav-link">Learn</a>
        <a href="./methodology.html" class="nav-link">Methodology</a>
      </nav>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle theme"><svg class="i-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M20 14.2A8.2 8.2 0 019.8 4a8.4 8.4 0 100 20 8.2 8.2 0 0010.2-9.8z"/></svg><svg class="i-system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path stroke-linecap="round" d="M8.5 20.5h7"/></svg></button>
      <a href="https://azqato.github.io/support.html" target="_blank" rel="noopener noreferrer"
        class="btn-link rounded-pill bg-accent text-on-accent text-small font-medium px-4 py-2 shrink-0">
        Support
      </a>
    </div>
  </header>

  <!-- ── Main ── -->
  <main class="flex-1 w-full max-w-content mx-auto px-4 py-8">
    <div class="flex flex-col gap-8">

      <!-- Pre-filled from ?q= by assets/js/search-page.js -->
      <form action="./search.html" method="get" class="flex gap-2" role="search">
        <input type="search" name="q" id="search-input" placeholder="Brand or product name…"
          aria-label="Search cat food products"
          class="flex-1 min-w-0 border border-hairline rounded-card px-4 py-3 text-small text-ink bg-surface" />
        <button type="submit"
          class="btn-link rounded-card bg-accent text-on-accent font-medium text-small px-5 py-3 shrink-0 border-0 cursor-pointer">
          Search
        </button>
      </form>

      <!-- Results -->
      <section aria-label="Search results">
        <p id="results-label" class="text-small text-ink-soft mb-4" hidden></p>

        <ul id="results-list" class="flex flex-col gap-3" style="list-style:none;padding:0"></ul>
      </section>

    </div>
  </main>

  <!-- ── Footer ── -->
  <footer class="border-t border-hairline mt-12 py-6 text-center">
    <p class="text-micro text-ink-soft">
      Built by <a href="https://azqato.github.io/index.html" target="_blank" rel="noopener noreferrer"
        class="text-accent footer-link">Azqato</a>
    </p>
  </footer>

  <script type="module" src="./assets/js/search-page.js"></script>

  <script src="./assets/js/pwa.js"></script>

</body>
</html>
